<!doctype html><html lang="en"><head><meta charset="utf-8">
<!-- The link preview card (img/og.png). Serve the repo root (python3 -m http.server), open /tools/og-card.html
     at 1200x630 and screenshot it; README has the command. -->
<link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../home.css">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#102634}
.card{position:relative;width:1200px;height:630px;background:radial-gradient(900px 520px at 78% 30%,#173548 0%,#102634 60%);color:#f6f1e4}

.card .on{margin:28px 0 0;font-size:26px;color:#c9d3d8}

<body class="home"><div class="card">
<div class="copy"><img src="../img/icon.webp" alt=""><p class="name">Nidaa</p><p class="ar" lang="ar">نداء</p><p class="on">iPhone · Apple Watch</p></div>
<figure class="phone"><div class="screen" dir="ltr" data-countdown="7827"><img src="../img/today.webp" alt=""></div></figure>
</div><script src="../home.js"></script></body></html>
